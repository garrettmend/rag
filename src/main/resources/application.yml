spring:
  application:
    name: rag

app:
  datasource:
    jdbc-url: jdbc:postgresql://localhost:5433/ragdb
    # Must be a non-owner role, not the superuser, or Postgres bypasses row-level security.
    username: rag_app
    password: app_pw

worker:
  datasource:
    jdbc-url: jdbc:postgresql://localhost:5433/ragdb
    username: rag_worker
    password: worker_pw

aws:
  region: us-east-1
  bedrock:
    embedding-model-id: amazon.titan-embed-text-v2:0
    chat-model-id: us.anthropic.claude-haiku-4-5-20251001-v1:0
  sqs:
    ingestion-queue-url: https://sqs.us-east-1.amazonaws.com/682595228339/rag-ingestion-queue